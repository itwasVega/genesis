name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile Mac/Backend/outputs/*.py
      - name: Engine end to end
        run: python tests/test_engine.py
      - name: Policies
        run: python tests/test_policies.py
