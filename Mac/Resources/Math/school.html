<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="katex.min.css">
<style>
:root{color-scheme:light dark;--ink:#1A1A1F;--muted:#52525B;--chip:rgba(11,11,13,.055);--chipBorder:rgba(11,11,13,.09);--chipText:#1A1A1F}
@media (prefers-color-scheme: dark){:root{--ink:#D2D2DA;--muted:#A0A0AB;--chip:rgba(255,255,255,.07);--chipBorder:rgba(255,255,255,.10);--chipText:#E6E6EE}}
html,body{margin:0;padding:0;background:transparent}
body{color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
#c{padding:2px 0}
.p{margin:0 0 10px 0;white-space:pre-wrap}
.p:last-child{margin-bottom:0}
code{font:0.85em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);color:var(--chipText);padding:0.08em 0.3em;border-radius:0.3em;border:0.5px solid var(--chipBorder);white-space:nowrap}
code.term{font:0.94em -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
strong{font-weight:600}
.katex{font-size:1.12em}
.katex-display{margin:10px 0;text-align:left;overflow-x:auto;overflow-y:hidden}
.katex-display>.katex{text-align:left}
</style>
<script src="katex.min.js"></script><script src="school.js"></script></head>
<body><div id="c"></div></body></html>
